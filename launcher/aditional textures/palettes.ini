; Colours 3 to 6 of a fighter, made from his own sheets when the game loads
; them (src/runtime/palettes.c). One section a fighter, by his sheets' name.
;
;   base     the sheet the colours start from: 1 (X_DIFFUSE) or 2 (X_DIFFUSE2)
;   hue      the hue of what changes colour in that sheet, in degrees
;   pick     how far from that hue a pixel still changes (degrees)
;   sat_min  pixels less saturated than this stay as they are (skin, greys)
;   3 .. 6   a colour: its hue (-1 keeps it), saturation x, value x
;
; A palettes.ini beside umk3.ini adds to this one or changes it.

[KUNGLAO]
; his trousers and sash: blue (196) in his second sheet
base = 2
hue = 196
pick = 26
sat_min = 0.30
3 = 118 1.00 1.32     ; green
4 = 358 0.92 1.32     ; red
5 = 286 1.00 1.38     ; purple
6 = -1 0.00 0.80      ; grey
