; THE BELL TOWER -- ENHANCED LIGHTING's lighting file (see README.txt)
;
; As its textures paint it (Mary): the night sky, deep blue, through the
; three windows of the back wall (polySurface125, about y=8, z=2), and the
; wooden floor lit warm from above and in front, the stone around it dark.

; its light the colour of its own picture, not of its sky (Mary): the
; wood's warm amber over the stage and the fighters
sky_color=215,165,100
sky_strength=0.7

; the night's blue light through each window, onto the bars, the posts
; and the fighters' backs: cool and soft, moonlight, not a flame
[light]
type=point
pos=-3.2,7.4,1.9
color=80,115,215
intensity=1.1
radius=7

