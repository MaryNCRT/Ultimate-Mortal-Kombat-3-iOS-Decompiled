; THE BALCONY -- ENHANCED LIGHTING's lighting file (see README.txt)
;
; Its two torches at the ends of the floor (newfire, newfire001 on the left
; at x=-6.5; newfire002, newfire003 on the right at x=9.9, about 1.6 up)
; light a fighter warm as he passes near them, and cast his shadow on the
; wall (Mary).

[light]
type=point
mesh=newfire
color=255,140,50
intensity=3.0
radius=7
shadows=1

[light]
