name: linux

# What can be checked without the player's .ipa: the launcher's tests, and
# every source of the Linux game compiled with only the headers the game
# ships (no SDL2 or OpenGL -dev package installed). The link needs the data
# tables generated from the .ipa, which cannot be in CI.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Launcher tests
        working-directory: launcher/app
        run: |
          npm ci --ignore-scripts
          npm test
      - name: The build from a terminal answers
        run: node launcher/app/cli.js --help || test $? -eq 2
      - name: No SDL2 or OpenGL development headers on the machine
        run: |
          sudo apt-get remove -y libsdl2-dev libgl-dev libgl1-mesa-dev mesa-common-dev || true
          test ! -e /usr/include/SDL2/SDL.h
      - name: Every game source compiles for Linux
        run: python3 tools/ci_compile_linux.py clang
